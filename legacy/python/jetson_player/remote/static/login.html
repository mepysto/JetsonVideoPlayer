<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c1017">
<title>Jetson Player Remote — 로그인</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0c1017; color: #f0f4fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { width: 100%; max-width: 360px; background: #141a24; border: 1px solid #232c3d; border-radius: 18px; padding: 28px 22px; text-align: center; }
  .title { font-size: 17px; font-weight: 800; color: #e9ff5b; letter-spacing: 1px; margin-bottom: 8px; }
  .desc { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 22px; }
  input { width: 100%; font-size: 32px; letter-spacing: 16px; text-align: center; padding: 12px 0 12px 16px; background: #0f141d;
          color: #fff; border: 1px solid #2a3447; border-radius: 12px; outline: none; font-family: monospace; }
  input:focus { border-color: #e9ff5b; }
  button { margin-top: 16px; width: 100%; padding: 14px; font-size: 16px; font-weight: 800; border: 0; border-radius: 12px; background: #e9ff5b; color: #0c1017; }
  button:disabled { opacity: 0.5; }
  .msg { margin-top: 14px; min-height: 18px; font-size: 13px; color: #ff8a80; }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="title">⚡ JETSON REMOTE</div>
  <div class="desc">플레이어 화면의 <b>⋯ 메뉴 → 📱 스마트폰 웹 리모컨</b>에 표시된<br>4자리 PIN을 입력하거나 QR 코드를 찍으세요.</div>
  <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" autofocus placeholder="····">
  <button id="go" type="submit">연결</button>
  <div class="msg" id="msg"></div>
</form>
<script>
const f = document.getElementById('f'), pin = document.getElementById('pin'), msg = document.getElementById('msg'), go = document.getElementById('go');
pin.addEventListener('input', () => { pin.value = pin.value.replace(/\D/g, '').slice(0, 4); if (pin.value.length === 4) f.requestSubmit(); });
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  go.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: pin.value }) });
    if (r.ok) { location.replace('/'); return; }
    const j = await r.json().catch(() => ({}));
    msg.textContent = r.status === 429 ? '시도 횟수를 초과했습니다. 5분 후 다시 시도하세요.' : 'PIN이 올바르지 않습니다.';
    pin.value = ''; pin.focus();
  } catch (err) {
    msg.textContent = '플레이어에 연결할 수 없습니다.';
  }
  go.disabled = false;
});
</script>
</body>
</html>
